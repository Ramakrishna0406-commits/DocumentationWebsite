<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DATA PULSE - CoCubes Overview</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
<script>Chart.register(ChartDataLabels);</script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#243333;
}

.header{
    background:white;
    padding:18px;
    text-align:center;
    border-bottom:3px solid #007367;
}

.header h1{
    margin:0;
    color:#007367;
    font-size:25px;
}

.header p{
    margin:6px 0 0;
    color:#666;
    font-size:13px;
}

.content{
    max-width:1400px;
    margin:25px auto;
    padding:0 25px 40px;
}

.graph-grid{
    display:flex;
    flex-direction:column;
    gap:24px;
}

.graph-card{
    background:white;
    border-radius:14px;
    padding:20px 24px;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
    min-width:0;
    display:grid;
    grid-template-columns:220px minmax(0,1fr);
    align-items:center;
    gap:25px;
    transition:transform .25s ease, box-shadow .25s ease;
}

.graph-card:hover{
    transform:scale(1.05);
    box-shadow:0 8px 24px rgba(0,0,0,.18);
    z-index:5;
}

.graph-card h2{
    margin:0;
    text-align:left;
    color:#007367;
    font-size:18px;
    line-height:1.3;
}

.chart-container{
    position:relative;
    height:420px;
}

.loading{
    text-align:center;
    padding:40px;
    color:#777;
}

@media(max-width:650px){

    .content{
        padding:0 12px 30px;
    }

    .graph-grid{
        display:flex;
        flex-direction:column;
        gap:20px;
    }

    .graph-card{
        grid-template-columns:1fr;
        gap:10px;
    }

    .graph-card h2{
        text-align:center;
    }

    .chart-container{
        height:360px;
    }
}
    #campusFilter{
        transition:transform 0.2s ease;
    }

    #campusFilter:hover{
        transform:scale(1.08);
    }
    .graph-card-2027 .chart-container{height:500px;}</style>


<body>

<div class="header">
    <h1>COCUBES OVERVIEW</h1>
    <p id="yearTitle">Loading...</p>
    <div id="campusFilter" style="display:none;margin-top:12px;">
        <label for="campusSelect" style="font-size:13px;color:#666;margin-right:8px;">Campus:</label>
        <select id="campusSelect" style="padding:7px 12px;border:1px solid #ccc;border-radius:6px;font-size:13px;background:white;">
            <option value="ALL">All Campuses</option>
            <option value="VSKP">VSKP</option>
            <option value="BLR">BLR</option>
            <option value="HYD">HYD</option>
        </select>
    </div>
</div>

<div class="content">

    <div id="graphGrid" class="graph-grid">

        <div class="loading">
            Loading examination graphs...
        </div>

    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const year = params.get("year") || "2027";

const campusFilter = document.getElementById("campusFilter");
const campusSelect = document.getElementById("campusSelect");

function filterRowsByCampus(rows){
    const selectedCampus = campusSelect.value;

    if(selectedCampus === "ALL"){
        return rows;
    }

    const dataCampus =
        year === "2027" && selectedCampus === "VSKP"
            ? "VSP"
            : selectedCampus;

    return rows.filter(function(row){
        return clean(row.Location) === dataCampus;
    });
}

const dataFile =
    year === "2026"
        ? "../data/cocubes-2026.json"
        : "../data/cocubes-2027.json";


document.getElementById("yearTitle").textContent =
    "Pre Assessment vs Post Assessment — " + year;


/* ==========================================================
   EXAMINATIONS
========================================================== */

const exams2026 = [

    {
        key:"Domain Test",
        title:"Domain"
    },

    {
        key:"English Usage",
        title:"English Usage"
    },

    {
        key:"Quantitative Aptitude",
        title:"Quantitative Aptitude"
    },

    {
        key:"Analytical Reasoning",
        title:"Analytical Reasoning"
    },

    {
        key:"Coding",
        title:"Coding"
    },

    {
        key:"Written English Test",
        title:"Written English Test"
    },

    {
        key:"Computer Fundamentals",
        title:"Computer Fundamentals"
    }

];


const exams2027 = [

    {
        key:"domain",
        title:"Domain",
        pre:"Domain Fitment - Pre Assessment",
        post:"Domain Fitment - Post Assessment"
    },

    {
        key:"english",
        title:"English Usage",
        pre:"English Usage Fitment - Pre Assessment",
        post:"English Usage Fitment - Post Assessment"
    },

    {
        key:"quant",
        title:"Quantitative Aptitude",
        pre:"Quantitative Ability Fitment - Pre Assessment",
        post:"Quantitative Ability Fitment - Post Assessment"
    },

    {
        key:"analytical",
        title:"Analytical Reasoning",
        pre:"Analytical Reasoning Fitment - Pre Assessment",
        post:"Analytical Reasoning Fitment - Post Assessment"
    },

    {
        key:"coding",
        title:"Coding",
        pre:"Coding Fitment - Pre Assessment",
        post:"Coding Fitment - Post Assessment"
    },

    {
        key:"written",
        title:"Written English Test",
        pre:"Written English Fitment - Pre Assessment",
        post:"Written English Fitment - Post Assessment"
    },

    {
        key:"computer",
        title:"Computer Fundamentals",
        pre:"Computer Fundamentals Fitment - Pre Assessment",
        post:"Computer Fundamentals Fitment - Post Assessment"
    }

];


/* ==========================================================
   STATUS LIST
========================================================== */

const statuses = [

    "Good to Go",
    "Need Training",
    "Need Practice",
    "Not Appeared"

];


/* ==========================================================
   CLEAN
========================================================== */

function clean(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value).trim();

}


/* ==========================================================
   NORMALIZE STATUS
========================================================== */

function normalizeStatus(value){

    const status = clean(value);

    if(status === "Not Attended"){
        return "Not Appeared";
    }

    if(status === "Good to Go"){
        return "Good to Go";
    }

    if(status === "Need Training"){
        return "Need Training";
    }

    if(status === "Need Practice"){
        return "Need Practice";
    }

    if(status === "Not Appeared"){
        return "Not Appeared";
    }

    return "";

}


/* ==========================================================
   2026 COUNT
========================================================== */

function count2026(rows, examName, stage){

    const result = {
        "Good to Go":0,
        "Need Training":0,
        "Need Practice":0,
        "Not Appeared":0
    };

    rows.forEach(function(row){

        const examObject = row[examName];

        if(!examObject){
            return;
        }

        const status =
            normalizeStatus(
                examObject[stage]
            );

        if(result.hasOwnProperty(status)){
            result[status]++;
        }

    });

    return result;

}


/* ==========================================================
   2027 COUNT
========================================================== */

function count2027(rows, exam, field){

    const result = {
        "Good to Go":0,
        "Need Training":0,
        "Need Practice":0,
        "Not Appeared":0
    };

    rows.forEach(function(row){

        const status =
            normalizeStatus(
                row[field]
            );

        if(result.hasOwnProperty(status)){
            result[status]++;
        }

    });

    return result;

}


/* ==========================================================
   CREATE GRAPH CARD
========================================================== */

function createGraphCard(exam, index){

    const card =
        document.createElement("div");

    card.className = "graph-card" + (window.currentDashboardYear === "2027" ? " graph-card-2027" : "");

    card.innerHTML = `

        <h2>${exam.title}</h2>

        <div class="chart-container">
            <canvas id="overviewChart${index}"></canvas>
        </div>

    `;

    return card;

}


/* ==========================================================
   CREATE 2026 GRAPH
========================================================== */

function create2026Chart(rows, exam, index){

    const pre =
        count2026(
            rows,
            exam.key,
            "Pre 1"
        );

    const post1 =
        count2026(
            rows,
            exam.key,
            "Post 1"
        );

    const post2 =
        count2026(
            rows,
            exam.key,
            "Post 2"
        );


    new Chart(

        document.getElementById(
            "overviewChart" + index
        ),

        {

            type:"bar",
            indexAxis:"y",

            data:{

                labels:statuses,

                datasets:[

                    {
                        label:"Pre 1",
                        data:statuses.map(
                            s => pre[s]
                        ),
                        backgroundColor:"#9bc5bf"
                    },

                    {
                        label:"Post 1",
                        data:statuses.map(
                            s => post1[s]
                        ),
                        backgroundColor:"#4da69a"
                    },

                    {
                        label:"Post 2",
                        data:statuses.map(
                            s => post2[s]
                        ),
                        backgroundColor:"#007367"
                    }

                ]

            },

            options:{

                responsive:true,

                maintainAspectRatio:false,

                interaction:{
                    mode:"index",
                    intersect:false
                },

                plugins:{


                    legend:{
                        position:"bottom"
                    },

                    datalabels:{
                        anchor:function(context){
                            const status = statuses[context.dataIndex];
                            const middleBar = (exam.key==="domain" && status==="Need Training") || (exam.key==="english" && status==="Good to Go");
                            return middleBar ? "center" : "end";
                        },
                        align:function(context){
                            const status = statuses[context.dataIndex];
                            const middleBar = (exam.key==="domain" && status==="Need Training") || (exam.key==="english" && status==="Good to Go");
                            return middleBar ? "center" : "top";
                        },
                        formatter:function(value, context){
                            const dataset = context.dataset.data;
                            const total = dataset.reduce(
                                (sum, item) => sum + Number(item || 0),
                                0
                            );
                            if(total === 0){
                                return "0%";
                            }
                            return ((value / total) * 100).toFixed(0) + "%";
                        },
                        font:{
                            weight:"bold",
                            size:14
                        },

                        color:"#333"
                },

                scales:{

                    x:{
                        ticks:{
                            maxRotation:0,
                            minRotation:0
                        }
                    },

                    y:{

                        beginAtZero:true,

                        ticks:{
                            precision:0
                        },

                        title:{
                            display:true,
                            text:"Students"
                        }

                    }

                }

            }

        }

        }
    );

}


/* ==========================================================
   CREATE 2027 GRAPH
========================================================== */

function create2027Chart(rows, exam, index){

    const pre =
        count2027(
            rows,
            exam,
            exam.pre
        );

    const post =
        count2027(
            rows,
            exam,
            exam.post
        );


    new Chart(

        document.getElementById(
            "overviewChart" + index
        ),

        {

            type:"bar",
            indexAxis:"y",

            data:{

                labels:statuses,

                datasets:[

                    {
                        label:"Pre Assessment",
                        data:statuses.map(
                            s => pre[s]
                        ),
                        backgroundColor:"#9bc5bf"
                    },

                    {
                        label:"Post Assessment",
                        data:statuses.map(
                            s => post[s]
                        ),
                        backgroundColor:"#007367"
                    }

                ]

            },

            options:{

                responsive:true,

                maintainAspectRatio:false,

                interaction:{
                    mode:"index",
                    intersect:false
                },

                plugins:{

                    tooltip:{
                        callbacks:{
                            label:function(context){
                                const dataset = context.dataset.data;
                                const total = dataset.reduce((sum, item) => sum + Number(item || 0), 0);
                                const value = Number(context.raw || 0);
                                const percentage = total === 0 ? 0 : ((value / total) * 100).toFixed(0);
                                return context.dataset.label + ": " + percentage + "%";
                            }
                        }
                    },

                    legend:{
                        position:"bottom"
                    },

                    datalabels:{
                        anchor:"end",
                        align:"top",
                        formatter:function(value, context){

                            const dataset = context.dataset.data;
                            const total = dataset.reduce(
                                (sum, item) => sum + Number(item || 0),
                                0
                            );

                            if(total === 0){
                                return "0%";
                            }

                            return ((value / total) * 100).toFixed(0) + "%";

                        },

                        font:{
                            weight:"bold",
                             size:14
                        },

                        color:"#333"
                    }

                },

                scales:{

                    x:{
                        ticks:{
                            maxRotation:0,
                            minRotation:0
                        }
                    },

                    y:{

                        beginAtZero:true,

                        ticks:{
                            precision:0
                        },

                        title:{
                            display:true,
                            text:"Students"
                        }

                    }

                }

            }

        }

    );

}


/* ==========================================================
   LOAD DATA
========================================================== */

fetch(dataFile)

    .then(function(response){

        if(!response.ok){
            throw new Error(
                "Unable to load " + dataFile
            );
        }

        return response.json();

    })

    .then(function(rows){

        if(!Array.isArray(rows)){
            throw new Error(
                "JSON does not contain an array"
            );
        }

        campusFilter.style.display = "block";

        function renderGraphs(){        window.currentDashboardYear = year;

            const grid =
                document.getElementById(
                    "graphGrid"
                );

            grid.innerHTML = "";

            const filteredRows = filterRowsByCampus(rows);

            if(year === "2026"){

                exams2026.forEach(
                    function(exam,index){

                        if(exam.title === "Computer Fundamentals") return;

                        grid.appendChild(
                            createGraphCard(
                                exam,
                                index
                            )
                        );

                        create2026Chart(
                            filteredRows,
                            exam,
                            index
                        );

                    }
                );

            }
            else{

                exams2027.forEach(
                    function(exam,index){

                        if(exam.title === "Computer Fundamentals") return;

                        grid.appendChild(
                            createGraphCard(
                                exam,
                                index
                            )
                        );

                        create2027Chart(
                            filteredRows,
                            exam,
                            index
                        );

                    }
                );

            }

        }

        campusSelect.addEventListener("change", renderGraphs);

        renderGraphs();

    })

    .catch(function(error){

        document.getElementById(
            "graphGrid"
        ).innerHTML = `

            <div class="loading">

                Unable to load CoCubes ${year}
                examination graphs.

                <br><br>

                ${error.message}

            </div>

        `;

        console.error(
            "CoCubes Overview Error:",
            error
        );

    });

</script>

</body>
</html>
