<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATA PULSE - Team Dashboard Login</title>

    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

    <header class="header">
        <h1>DATA PULSE</h1>
        <h2>Monthly Forecast Management</h2>
        <h3>Team / Admin Login</h3>
    </header>

    <section class="login-section">

        <div class="login-card">

            <h2>Team Login</h2>

            <input
                type="text"
                id="username"
                placeholder="Enter User Name">

            <input
                type="email"
                id="email"
                placeholder="Enter GITAM Email">

            <button id="sendOtpBtn">
                Send OTP
            </button>

        </div>

    </section>

    <script src="../js/login.js"></script>

</body>
</html>
