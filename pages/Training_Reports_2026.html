<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>DATA PULSE — Training Reports</title>


    <style>

        /* =====================================================
           RESET
           ===================================================== */

        * {
            box-sizing: border-box;
        }


        /* =====================================================
           BODY
           ===================================================== */

        body {
            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f7f7;

            color: #222;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        header {

            background: #007367;

            color: white;

            padding: 18px 30px;
        }


        .title {

            font-size: 24px;

            font-weight: 600;
        }


        /* =====================================================
           MAIN CONTAINER
           ===================================================== */

        .container {

            padding: 25px;
        }


        /* =====================================================
           YEAR TABS
           ===================================================== */

        .year-tabs {

            display: flex;

            gap: 10px;

            margin-bottom: 20px;

            border-bottom:
                2px solid #ddd;

            padding-bottom: 10px;
        }


        .year-tab {

            border: none;

            background: #e9eeee;

            color: #333;

            padding:
                12px 25px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;

            font-weight: 600;

            transition:
                background 0.2s,
                color 0.2s;
        }


        .year-tab:hover {

            background: #d8e4e3;
        }


        .year-tab.active {

            background: #007367;

            color: white;
        }


        /* =====================================================
           SUB TABS
           ===================================================== */

        .sub-tabs {

            display: flex;

            gap: 10px;

            margin-bottom: 15px;

            flex-wrap: wrap;
        }


        .sub-tab {

            border: none;

            background: #e9eeee;

            color: #333;

            padding:
                10px 18px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

            transition:
                background 0.2s,
                color 0.2s;
        }


        .sub-tab:hover {

            background: #d8e4e3;
        }


        .sub-tab.active {

            background: #007367;

            color: white;
        }


        /* =====================================================
           REPORT PANEL
           ===================================================== */

        .panel {

            background: white;

            border-radius: 8px;

            padding: 15px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);
        }


        /* =====================================================
           REPORT IFRAME
           ===================================================== */

        .viewer {

            width: 100%;

            height: 75vh;

            border: none;

            display: block;

            border-radius: 5px;

            background: white;
        }


        /* =====================================================
           INFORMATION MESSAGE
           ===================================================== */

        .info {

            text-align: center;

            padding:
                50px 20px;
        }


        .info h2 {

            margin:
                0 0 10px;

            color: #007367;
        }


        .info p {

            margin: 0;

            color: #666;

            font-size: 16px;
        }


        /* =====================================================
           HIDDEN
           ===================================================== */

        .hidden {

            display: none !important;
        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 768px) {

            header {

                padding:
                    15px 20px;
            }


            .title {

                font-size: 20px;
            }


            .container {

                padding: 15px;
            }


            .year-tabs {

                flex-wrap: wrap;
            }


            .year-tab {

                font-size: 14px;

                padding:
                    10px 18px;
            }


            .viewer {

                height: 70vh;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<header>

    <div class="title">
        DATA PULSE — Training Reports
    </div>

</header>



<main class="container">

    <div style="display:flex; justify-content:flex-start; margin:20px 0;">
        <button type="button" onclick="window.location.href='Training_Reports_Years.html';" style="border:none; background:#007367; color:white; padding:10px 18px; font-size:15px; font-weight:bold; border-radius:8px; cursor:pointer;">
            ← Back / Home
        </button>
    </div>

    <section id="year2026">


        <!-- =================================================
             2026 SUB TABS
             ================================================= -->

        <div class="sub-tabs">


            <!-- 2026 COCUBES DASHBOARD -->

            <button
                type="button"
                class="sub-tab active"
                onclick="
                    openReport(
                        'CoCubes_2026_DATA_PULSE.html',
                        this
                    );
                ">

                CoCubes Dashboard

            </button>


            <!-- 2026 COCUBES STUDENT DETAILS -->

            <button
                type="button"
                class="sub-tab"
                onclick="
                    openReport(
                        'CoCubes_2026_Student_Details.html',
                        this
                    );
                ">

                CoCubes Student Details

            </button>


        </div>


        <!-- =================================================
             2026 REPORT VIEWER
             ================================================= -->

        <div class="panel">

            <iframe
                id="reportFrame2026"
                class="viewer"
                src="CoCubes_2026_DATA_PULSE.html"
                title="2026 CoCubes Dashboard">
            </iframe>

        </div>


    </section>



    <!-- =====================================================
         2027 TRAINING REPORTS
         ===================================================== -->


</body>

</html>
