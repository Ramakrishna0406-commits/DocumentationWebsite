<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mentor Mentee Dashboard</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="../css/ccm-style.css">

</head>


<body>


<div class="container-fluid py-4">


<!-- ================= HEADER ================= -->

<div class="dashboard-header text-center mb-4">

    <h1 class="fw-bold">

        <i class="bi bi-people-fill"></i>

        Mentor Mentee Dashboard

    </h1>


    <p>
        University Mentor-Mentee Monitoring System
    </p>


    <small id="currentDate"></small>


</div>



<!-- ================= ACTION BUTTONS ================= -->

<div class="row mb-4">


<div class="col-md-2 mb-2">

<button id="exportBtn" class="btn btn-success w-100">

<i class="bi bi-file-earmark-excel"></i>

Export Excel

</button>

</div>



<div class="col-md-2 mb-2">

<button id="resetBtn" class="btn btn-danger w-100">

<i class="bi bi-arrow-clockwise"></i>

Clear Filters

</button>

</div>


</div>




<!-- ================= FILTERS ================= -->


<div class="card shadow-sm mb-4">


<div class="card-header bg-primary text-white">

<h5 class="mb-0">

<i class="bi bi-funnel-fill"></i>

Filters

</h5>

</div>



<div class="card-body">


<div class="row g-3">



<div class="col-lg-3 col-md-4">

<label class="form-label fw-bold">
University
</label>

<select id="universityFilter" class="form-select">

<option value="">All</option>

</select>

</div>




<div class="col-lg-3 col-md-4">

<label class="form-label fw-bold">
Campus
</label>

<select id="campusFilter" class="form-select">

<option value="">All</option>

</select>

</div>





<div class="col-lg-3 col-md-4">

<label class="form-label fw-bold">
School
</label>

<select id="schoolFilter" class="form-select">

<option value="">All</option>

</select>

</div>





<div class="col-lg-3 col-md-4">

<label class="form-label fw-bold">
Course
</label>

<select id="courseFilter" class="form-select">

<option value="">All</option>

</select>

</div>





<div class="col-lg-3 col-md-4">

<label class="form-label fw-bold">
Department
</label>

<select id="departmentFilter" class="form-select">

<option value="">All</option>

</select>

</div>





<div class="col-lg-3 col-md-4">

<label class="form-label fw-bold">
Pass Out Year
</label>

<select id="yearFilter" class="form-select">

<option value="">All</option>

</select>

</div>





<div class="col-lg-3 col-md-4">

<label class="form-label fw-bold">
Mentor Name
</label>

<select id="mentorFilter" class="form-select">

<option value="">All</option>

</select>

</div>



</div>


</div>


</div>






<!-- ================= KPI CARDS ================= -->


<div class="row g-4 mb-4">



<div class="col-lg-3 col-md-6">

<div class="kpi-card students">


<div class="icon">

<i class="bi bi-mortarboard-fill"></i>

</div>


<div>

<h6>Total Students</h6>

<h2 id="totalStudents">0</h2>

</div>


</div>

</div>






<div class="col-lg-3 col-md-6">

<div class="kpi-card started">


<div class="icon">

<i class="bi bi-check-circle-fill"></i>

</div>


<div>

<h6>Started</h6>

<h2 id="startedStudents">0</h2>

</div>


</div>

</div>







<div class="col-lg-3 col-md-6">

<div class="kpi-card pending">


<div class="icon">

<i class="bi bi-hourglass-split"></i>

</div>


<div>

<h6>Yet To Start</h6>

<h2 id="yetStudents">0</h2>

</div>


</div>

</div>







<div class="col-lg-3 col-md-6">

<div class="kpi-card completed">


<div class="icon">

<i class="bi bi-rocket-takeoff-fill"></i>

</div>


<div>

<h6>Completed</h6>

<h2 id="completedStudents">0</h2>

</div>


</div>

</div>



</div>







<!-- ================= MENTOR SUMMARY ================= -->


<div class="card shadow">


<div class="card-header bg-success text-white">

<h5 class="mb-0">

<i class="bi bi-person-lines-fill"></i>

Mentor Summary

</h5>

</div>




<div class="table-responsive">


<table id="mentorTable" class="table table-bordered table-hover mb-0">


<thead class="table-dark">


<tr>

<th>Mentor Name</th>

<th>Student Count</th>

<th>Started</th>

<th>Yet To Start</th>

<th>Completed</th>

<th>Grand Total</th>


</tr>


</thead>




<tbody id="mentorTableBody">


</tbody>



</table>


</div>



</div>





</div>






<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<!-- Excel Export -->

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>


<!-- Data -->
<script src="../js/ccm-data.js"></script>


<!-- Main Script -->

<script src="../js/ccm-script.js"></script>



<script>

document.getElementById("currentDate").innerHTML =
"Last Updated : " + new Date().toLocaleDateString();


</script>



</body>

</html>
