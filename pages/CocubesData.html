<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cocubes Data</title>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    margin:20px;
    padding:0;
    background:#fff;
}

h1{
    color:#007367;
    border-bottom:3px solid #007367;
    padding-bottom:10px;
    margin-bottom:35px;
}

.image-container{
    display:flex;
    gap:30px;
}

.image-box{
    text-align:left;
}

.image-box img{
    width:400px;
    height:300px;
    cursor:pointer;
    display:block;
}

</style>

</head>

<body>

<h1>Cocubes Data</h1>

<div class="image-container">

    <div class="image-box">

        <img
            id="img2027"
            src="../images/img12off.jpg"
            alt="Cocubes Data 2027">

    </div>

</div>

<script>

// ---------- 2027 ----------

const img2027 = document.getElementById("img2027");

// Mouse Hover ON
img2027.addEventListener("mouseenter", function () {

    img2027.src = "../images/img12on.jpg";

});

// Mouse Hover OFF
img2027.addEventListener("mouseleave", function () {

    img2027.src = "../images/img12off.jpg";

});

// Click - Open Google Drive Folder
img2027.addEventListener("click", function () {

    window.open(
        "https://drive.google.com/drive/folders/1PYzLsoIecroSh3BzpFZyyPO5lHEBv9xQ?usp=drive_link",
        "_blank"
    );

});

</script>

</body>

</html>
