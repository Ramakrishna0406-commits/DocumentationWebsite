<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Training Report</title>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    margin:20px;
    padding:0;
    background:#fff;
}

.image-box{
    text-align:left;
}

.image-box img{
    width:400px;
    height:300px;
    cursor:pointer;
    display:block;
}

</style>

</head>


<body>


<div class="image-box">


<img
id="img12"
src="../images/img12off.jpg"
alt="Training Report">


</div>



<script>


const img = document.getElementById("img12");


// Open 2027 page inside the same DATA PULSE content area

img.addEventListener("click", function(){

    window.parent.loadPage("pages/2027.HTML");

});


// Mouse hover ON

img.addEventListener("mouseenter", function(){

    img.src="../images/img12on.jpg";

});


// Mouse hover OFF

img.addEventListener("mouseleave", function(){

    img.src="../images/img12off.jpg";

});


</script>


</body>

</html>
