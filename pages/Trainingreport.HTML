<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Training Report</title>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    margin:20px;
    padding:0;
    background:#fff;
}

/* Align image to left */
.image-box{
    text-align:left;
}

/* Image style */
.image-box img{
    width:400px;
    height:300px;
    cursor:pointer;
    display:block;
}

</style>

</head>

<body>

<div class="image-box">

<a href="2027.html">

<img
id="img12"
src="../images/img12off.jpg"
alt="Training Report">

</a>

</div>

<script>

const img=document.getElementById("img12");

// Mouse enters image
img.addEventListener("mouseenter",function(){

    img.src="../images/img12on.jpg";

});

// Mouse leaves image
img.addEventListener("mouseleave",function(){

    img.src="../images/img12off.jpg";

});

</script>

</body>

</html>
