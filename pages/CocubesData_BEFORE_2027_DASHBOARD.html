<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cocubes Data</title>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    margin:20px;
    background:#fff;
}


h1{
    color:#007367;
    border-bottom:3px solid #007367;
    padding-bottom:10px;
    margin-bottom:35px;
}


.image-container{
    display:flex;
    gap:30px;
}


.image-box{
    text-align:left;
}


.image-box img{
    width:400px;
    height:300px;
    cursor:pointer;
}


.result-container{

    display:none;
    margin-top:40px;

}


.result-title{

    color:#007367;
    font-size:24px;
    margin-bottom:20px;

}


.result-btn{

    display:inline-block;
    margin:10px;
    padding:15px 25px;
    background:#007367;
    color:white;
    text-decoration:none;
    border-radius:8px;
    cursor:pointer;

}


.result-btn:hover{

    background:#005c52;

}


</style>

</head>


<body>


<h1>Cocubes Data</h1>


<div class="image-container">


<div class="image-box">


<img
id="img2027"
src="../images/img12off.jpg"
alt="Cocubes Data 2027">


</div>


</div>



<div id="assessmentResults" class="result-container">


<div class="result-title">

Cocubes 2027 Assessment Results

</div>


<a class="result-btn"
href="https://drive.google.com/drive/folders/1vz0SQqgcd7D3HjnBAiDzXE1u5rPBakB7?usp=drive_link"
target="_blank">

Hyderabad

</a>


<a class="result-btn"
href="https://drive.google.com/drive/folders/1NBOidoA1FFBXlh8VR_7BP7JR_GULhFjf?usp=drive_link"
target="_blank">

Bengaluru

</a>



<a class="result-btn"
href="https://drive.google.com/drive/folders/10p5FxfT8J-ALfL6UvRRy2I4qXtNNisYV?usp=drive_link"
target="_blank">

Visakhapatnam

</a>



<a class="result-btn"
href="https://drive.google.com/drive/folders/1UfrSj8ZksHe0J_qQDMR2vLrYRG3LN__Z?usp=drive_link"
target="_blank">

POST Assessment Results

</a>


</div>



<script>


const img2027 = document.getElementById("img2027");

const assessmentResults =
document.getElementById("assessmentResults");



// Hover ON

img2027.addEventListener("mouseenter",function(){

    img2027.src="../images/img12on.jpg";

});



// Hover OFF

img2027.addEventListener("mouseleave",function(){

    img2027.src="../images/img12off.jpg";

});



// Click 2027

img2027.addEventListener("click",function(){


    assessmentResults.style.display="block";


});


</script>



</body>

</html>
