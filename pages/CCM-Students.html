<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Student Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <!-- Mentor Name -->
    <h2 id="mentorTitle" class="mb-4 text-center"></h2>

    <!-- Summary Cards -->
    <div class="row mb-4">

        <div class="col-md-3 mb-3">
            <div class="card text-center border-primary">
                <div class="card-body">
                    <h6>Total Students</h6>
                    <h3 id="totalStudents">0</h3>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card text-center border-success">
                <div class="card-body">
                    <h6>Completed</h6>
                    <h3 id="completedStudents">0</h3>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card text-center border-warning">
                <div class="card-body">
                    <h6>Started</h6>
                    <h3 id="startedStudents">0</h3>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card text-center border-danger">
                <div class="card-body">
                    <h6>Yet To Start</h6>
                    <h3 id="yetToStartStudents">0</h3>
                </div>
            </div>
        </div>

    </div>

    <!-- Search Box -->
    <div class="row mb-3">

        <div class="col-md-4">
            <input
                type="text"
                id="searchStudent"
                class="form-control"
                placeholder="Search Student Name">
        </div>

    </div>

    <!-- Student Table -->
    <div class="table-responsive">

        <table class="table table-bordered table-striped table-hover">

            <thead class="table-dark">

                <tr>

                    <th>S.No</th>
                    <th>Student Name</th>
                    <th>Pass Out Year</th>
                    <th>Degree</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody id="studentTableBody">

            </tbody>

        </table>

    </div>

</div>

<script src="../js/ccm-data.js"></script>
<script src="../js/ccm-students.js"></script>

</body>

</html>
